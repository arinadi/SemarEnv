name: Build SemarEnv Linux Packages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Packages (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x64
            os: ubuntu-22.04
            target: x64
          - arch: arm64
            os: ubuntu-22.04-arm
            target: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Electron build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            make \
            python3 \
            python3-pip \
            pkg-config \
            fakeroot \
            rpm

      - name: Setup Latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/helper-go/go.mod'
          cache-dependency-path: 'src/helper-go/go.sum'

      - name: Cache node_modules and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
            ~/.cache/node-gyp
          key: ${{ runner.os }}-${{ matrix.arch }}-node-${{ hashFiles('**/package.json') }}

      - name: Install Yarn and build tools
        run: |
          npm install -g yarn node-gyp
          python3 -m pip install --upgrade pip

      - name: Install dependencies with Yarn
        run: |
          yarn install

      - name: Build Go helper
        run: |
          cd "$GITHUB_WORKSPACE/src/helper-go"
          chmod +x ./build-os.sh
          bash ./build-os.sh

      - name: Build Electron packages with electron-builder
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_PUBLISH: 'false'
        run: |
          cd "$GITHUB_WORKSPACE"
          yarn build

      - name: Determine version from build config
        id: version
        run: |
          current=$(grep -oP "buildVersion:\s*'\K[^']+" configs/electron-builder.linux.ts)
          echo "Current buildVersion: $current"
          new="v$current"
          echo "tag=$new" >> $GITHUB_OUTPUT
          echo "Version tag: $new"

      - name: Create tag, release, and upload assets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$tag" -m "Release $tag"
          assets=$(ls release/*.deb release/*.rpm release/*.yml 2>/dev/null)
          if [ -z "$assets" ]; then
            echo "No release files found in release/"
            exit 1
          fi
          echo "Uploading assets: $assets"
          if gh release view "$tag" --repo arinadi/SemarEnv >/dev/null 2>&1; then
            gh release upload "$tag" $assets --repo arinadi/SemarEnv --clobber
          else
            gh release create "$tag" $assets \
              --title "SemarEnv $tag" \
              --notes "Build $(date +%Y-%m-%d)" \
              --repo arinadi/SemarEnv
          fi
