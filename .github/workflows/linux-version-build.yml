name: Build SemarEnv Linux Packages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Packages (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x64
            os: ubuntu-22.04
            target: x64
          - arch: arm64
            os: ubuntu-22.04-arm
            target: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Electron build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            make \
            python3 \
            python3-pip \
            pkg-config \
            fakeroot \
            rpm

      - name: Setup Latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/helper-go/go.mod'
          cache-dependency-path: 'src/helper-go/go.sum'

      - name: Cache node_modules and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
            ~/.cache/node-gyp
          key: ${{ runner.os }}-${{ matrix.arch }}-node-${{ hashFiles('**/package.json') }}

      - name: Install Yarn and build tools
        run: |
          npm install -g yarn node-gyp
          python3 -m pip install --upgrade pip

      - name: Install dependencies with Yarn
        run: |
          yarn install

      - name: Build Go helper
        run: |
          cd "$GITHUB_WORKSPACE/src/helper-go"
          chmod +x ./build-os.sh
          bash ./build-os.sh

      - name: Build Electron packages with electron-builder
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_PUBLISH: 'false'
        run: |
          cd "$GITHUB_WORKSPACE"
          yarn build

      - name: Determine next version tag
        id: version
        run: |
          existing=$(git tag --list 'v*' --sort=-v:refname)
          if [ -n "$existing" ]; then
            latest=$(echo "$existing" | head -1 | sed 's/^v//')
            major=$(echo "$latest" | cut -d. -f1)
            minor=$(echo "$latest" | cut -d. -f2)
            new="v${major}.$((minor + 1)).0"
          else
            new="v4.0.0"
          fi
          echo "tag=$new" >> $GITHUB_OUTPUT
          echo "New version tag: $new"

      - name: Create tag, release, and upload assets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag -a "$tag" -m "Release $tag"
          gh release create "$tag" \
            release/*.deb \
            release/*.rpm \
            release/*.yml \
            --title "SemarEnv $tag" \
            --notes "Build $(date +%Y-%m-%d)" \
            --repo arinadi/SemarEnv
