name: Build SemarEnv Windows Packages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Packages (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/helper-go/go.mod'
          cache-dependency-path: 'src/helper-go/go.sum'

      - name: Cache node_modules and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
            ~/.cache/node-gyp
            ~\AppData\Local\node-gyp
          key: ${{ runner.os }}-x64-node-${{ hashFiles('package.json', 'yarn.lock') }}

      - name: Install deps and build Go helper (parallel)
        run: |
          # Write Go build script (array avoids indented here-string issues)
          $goScript = @(
            'go install github.com/tc-hib/go-winres@latest',
            '$GOBIN = $(go env GOPATH) + "\bin"',
            '$env:PATH = "$GOBIN;$env:PATH"',
            'Set-Location src\helper-go',
            'go mod download',
            'go-winres make',
            '.\build-win.ps1'
          )
          $goScript | Set-Content go-build.ps1

          # Start Go build in background
          $goProc = Start-Process powershell -ArgumentList "-NoProfile", "-File", "go-build.ps1" -PassThru

          # Install tools and deps in parallel
          npm install -g yarn node-gyp
          python3 -m pip install --upgrade pip
          $env:LINK = "runtimeobject.lib"
          yarn install

          # Wait for Go build to finish
          $goProc.WaitForExit()
          if ($goProc.ExitCode -ne 0) {
            Write-Error "Go helper build failed with exit code $($goProc.ExitCode)"
            exit $goProc.ExitCode
          }
          Write-Output "Go helper build completed successfully"

      - name: Compute version and set package.json
        id: version
        run: |
          $pkgContent = Get-Content package.json -Raw
          # Save original to restore later
          Set-Content package.json.bak $pkgContent -NoNewline

          $majorMatch = [regex]::Match($pkgContent, '"version":\s*"(\d+)\.\d+\.\d+"')
          $major = $majorMatch.Groups[1].Value
          $runNumber = $env:GITHUB_RUN_NUMBER
          $shortHash = (git rev-parse --short=7 HEAD)
          $fullVersion = "$major.$runNumber.0"
          echo "Computed version: $fullVersion (commit: $shortHash)"

          # Temporarily set full version for electron-builder artifact naming
          $newVersionStr = '"version": "' + $fullVersion + '"'
          $pkgContent = $pkgContent -replace '"version":\s*"\d+\.\d+\.\d+"', $newVersionStr
          Set-Content package.json $pkgContent -NoNewline

          echo "tag=v$fullVersion" >> $env:GITHUB_OUTPUT
          echo "version=$fullVersion" >> $env:GITHUB_OUTPUT
          echo "shortHash=$shortHash" >> $env:GITHUB_OUTPUT

      - name: Build Electron packages with electron-builder
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_PUBLISH: 'false'
        run: |
          cd "$env:GITHUB_WORKSPACE"
          yarn build

      - name: Revert package.json to base version
        if: always()
        run: |
          if (Test-Path package.json.bak) {
            Copy-Item package.json.bak package.json -Force
            Remove-Item package.json.bak
          }

      - name: Create tag, release, and upload assets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $shortHash = "${{ steps.version.outputs.shortHash }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a $tag -m "Release $tag"

          # Collect existing release files
          $assets = @()
          Get-ChildItem release/*.exe,release/*.yml,release/*.blockmap -ErrorAction SilentlyContinue | ForEach-Object {
            $assets += $_.FullName
          }
          if ($assets.Count -eq 0) {
            Write-Error "No release files found in release/"
            exit 1
          }
          Write-Output "Uploading assets: $assets"

          gh release create $tag $assets `
            --title "SemarEnv $tag" `
            --notes "Build $(Get-Date -Format 'yyyy-MM-dd') | commit: $shortHash" `
            --repo arinadi/SemarEnv

      - name: Update latest tag
        continue-on-error: true
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:$env:PAT_TOKEN@github.com/arinadi/SemarEnv.git"
          git push origin --delete latest 2>$null
          git tag -f latest
          git push origin latest
