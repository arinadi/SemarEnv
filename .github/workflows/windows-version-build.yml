name: Build SemarEnv Windows Packages
on:
  push:
    paths:
      - 'build/windows.build.yml'

jobs:
  build-windows:
    name: Build Windows Packages (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # å®‰è£…å¿…è¦çš„æž„å»ºå·¥å…·
          choco install -y make

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/helper-go/go.mod'
          cache-dependency-path: 'src/helper-go/go.sum'

      - name: Cache node_modules and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
            ~/.cache/node-gyp
            ~\AppData\Local\node-gyp
          key: ${{ runner.os }}-x64-node-${{ hashFiles('**/package.json') }}

      - name: Install Yarn and build tools
        run: |
          npm install -g yarn node-gyp
          python -m pip install --upgrade pip

      - name: Install dependencies with Yarn
        run: |
          # Force link against WinRT runtime objects
          $env:LINK = "runtimeobject.lib"
          yarn install

      - name: Build Go helper with build-win.ps1
        run: |
          go install github.com/tc-hib/go-winres@latest
          $GOBIN = $(go env GOPATH) + "\bin"
          $env:PATH = "$GOBIN;$env:PATH"
          cd "$env:GITHUB_WORKSPACE/src/helper-go"
          go mod download
          go-winres make
          # ä½¿ç”¨ PowerShell è„šæœ¬æž„å»º
          .\build-win.ps1

      # å®‰è£… SignPath PowerShell æ¨¡å—,ä¾› electron-builder çš„ afterPack é’©å­è°ƒç”¨
      - name: Install SignPath PowerShell module
        run: |
          Install-Module -Name SignPath -Force -Scope CurrentUser -AllowClobber
          Import-Module SignPath

      # æ‰“åŒ…:afterPack é’©å­ä¼šæŠŠ win-unpacked å†…æ‰€æœ‰ PE(SemarEnv.exe / dll / .node / helper)
      # æ”¶é›†æˆ zip,ä¸€æ¬¡æ€§æäº¤ SignPath ç”¨ windows-app é…ç½®ç­¾å,å†è¦†ç›–å›žåŽŸä½ã€‚
      - name: Build Electron packages with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: '4db4007d-ac9e-4889-a8d5-52d4a421d989'
          SIGNPATH_PROJECT_SLUG: 'SemarEnv'
          SIGNPATH_POLICY_SLUG: 'test-signing'
          SIGNPATH_APP_ARTIFACT_CONFIG_SLUG: 'windows-app'
        run: |
          cd "$env:GITHUB_WORKSPACE"
          yarn build

      # ---- ç¬¬ 2 æ®µç­¾å:æ‰“åŒ…åŽç­¾å¤–å±‚å®‰è£…åŒ…/ä¾¿æºç‰ˆ ----
      # 1) å…ˆæŠŠå¾…ç­¾åçš„ exe ä½œä¸ºä¸€ä¸ªç‹¬ç«‹ artifact ä¸Šä¼ ;upload-artifact ä¼šè‡ªåŠ¨æ‰“æˆ zip,
      #    SignPath çš„ installer.artifact-configuration.xml ä»¥ <zip-file> ä¸ºæ ¹æ¥åŒ¹é…é‡Œé¢çš„ exeã€‚
      - name: Upload unsigned artifacts (for signing)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: SemarEnv-Windows-x64-unsigned
          path: |
            release/SemarEnv-Setup-*.exe
            release/SemarEnv-Portable-*.exe

      # 2) æäº¤ç»™ SignPath ç­¾å,å¹¶æŠŠç­¾ååŽçš„æ–‡ä»¶ä¸‹è½½å›ž release/signed/
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '4db4007d-ac9e-4889-a8d5-52d4a421d989'
          project-slug: 'SemarEnv'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'windows-installer'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'release/signed'

      # 3) ä¸Šä¼ ç­¾ååŽçš„äº§ç‰© + å…¶ä½™æ–‡ä»¶(installer/portable ç”¨å·²ç­¾åç‰ˆæœ¬)
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SemarEnv-Windows-x64
          path: |
            release/signed/*.exe
            release/*.msi
            release/*.yml
            release/*.blockmap
