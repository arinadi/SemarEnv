name: Build SemarEnv Windows Packages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Packages (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/helper-go/go.mod'
          cache-dependency-path: 'src/helper-go/go.sum'

      - name: Cache node_modules and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
            ~/.cache/node-gyp
            ~\AppData\Local\node-gyp
          key: ${{ runner.os }}-x64-node-${{ hashFiles('**/package.json') }}

      - name: Install Yarn and build tools
        run: |
          npm install -g yarn node-gyp
          python3 -m pip install --upgrade pip

      - name: Install dependencies with Yarn
        run: |
          $env:LINK = "runtimeobject.lib"
          yarn install

      - name: Build Go helper with build-win.ps1
        run: |
          go install github.com/tc-hib/go-winres@latest
          $GOBIN = $(go env GOPATH) + "\bin"
          $env:PATH = "$GOBIN;$env:PATH"
          cd "$env:GITHUB_WORKSPACE/src/helper-go"
          go mod download
          go-winres make
          .\build-win.ps1

      - name: Build Electron packages with electron-builder
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_PUBLISH: 'false'
        run: |
          cd "$env:GITHUB_WORKSPACE"
          yarn build

      - name: Determine version from build config
        id: version
        run: |
          $configFile = "configs/electron-builder.win.ts"
          $match = Select-String -Path $configFile -Pattern "buildVersion:\s*'([^']+)'"
          $current = $match.Matches[0].Groups[1].Value
          echo "Current buildVersion: $current"
          $new = "v$current"
          echo "tag=$new" >> $env:GITHUB_OUTPUT
          echo "Version tag: $new"

      - name: Create tag, release, and upload assets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a $tag -m "Release $tag"

          # Collect existing release files
          $assets = @()
          Get-ChildItem release/*.exe,release/*.yml,release/*.blockmap -ErrorAction SilentlyContinue | ForEach-Object {
            $assets += $_.FullName
          }
          if ($assets.Count -eq 0) {
            Write-Error "No release files found in release/"
            exit 1
          }
          Write-Output "Uploading assets: $assets"

          gh release create $tag $assets `
            --title "SemarEnv $tag" `
            --notes "Build $(Get-Date -Format 'yyyy-MM-dd')" `
            --repo arinadi/SemarEnv

      - name: Bump patch version in build config
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          $configFile = "configs/electron-builder.win.ts"
          $content = Get-Content $configFile -Raw
          $match = [regex]::Match($content, "buildVersion:\s*'(\d+)\.(\d+)\.(\d+)'")
          $major = $match.Groups[1].Value
          $minor = $match.Groups[2].Value
          $patch = [int]$match.Groups[3].Value + 1
          $newVersion = "$major.$minor.$patch"
          $content = $content -replace "buildVersion:\s*'\d+\.\d+\.\d+'", "buildVersion: '$newVersion'"
          Set-Content $configFile $content -NoNewline
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:$env:PAT_TOKEN@github.com/arinadi/SemarEnv.git"
          git add $configFile
          git commit -m "CI: bump buildVersion to $newVersion [skip ci]"
          git push
          echo "Bumped buildVersion: $($match.Value) -> $newVersion"

      - name: Update latest tag
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:$env:PAT_TOKEN@github.com/arinadi/SemarEnv.git"
          git push origin --delete latest 2>$null
          git tag -f latest
          git push origin latest
