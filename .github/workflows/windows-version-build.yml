name: Build SemarEnv Windows Packages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Packages (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/helper-go/go.mod'
          cache-dependency-path: 'src/helper-go/go.sum'

      - name: Cache node_modules and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
            ~/.cache/node-gyp
            ~\AppData\Local\node-gyp
          key: ${{ runner.os }}-x64-node-${{ hashFiles('**/package.json') }}

      - name: Install Yarn and build tools
        run: |
          npm install -g yarn node-gyp
          python3 -m pip install --upgrade pip

      - name: Install dependencies with Yarn
        run: |
          $env:LINK = "runtimeobject.lib"
          yarn install

      - name: Build Go helper with build-win.ps1
        run: |
          go install github.com/tc-hib/go-winres@latest
          $GOBIN = $(go env GOPATH) + "\bin"
          $env:PATH = "$GOBIN;$env:PATH"
          cd "$env:GITHUB_WORKSPACE/src/helper-go"
          go mod download
          go-winres make
          .\build-win.ps1

      - name: Build Electron packages with electron-builder
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_PUBLISH: 'false'
        run: |
          cd "$env:GITHUB_WORKSPACE"
          yarn build

      - name: Determine next version tag
        id: version
        run: |
          $existing = git tag --list 'v*' --sort=-v:refname
          if ($existing) {
            $latest = $existing[0] -replace '^v', ''
            $parts = $latest -split '\.'
            $minor = [int]$parts[1] + 1
            $new = "v$($parts[0]).$minor.0"
          } else {
            $new = "v4.0.0"
          }
          echo "tag=$new" >> $env:GITHUB_OUTPUT
          echo "New version tag: $new"

      - name: Create tag, release, and upload assets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a $tag -m "Release $tag"

          # Collect existing release files
          $assets = @()
          Get-ChildItem release/*.exe,release/*.yml,release/*.blockmap -ErrorAction SilentlyContinue | ForEach-Object {
            $assets += $_.FullName
          }
          if ($assets.Count -eq 0) {
            Write-Error "No release files found in release/"
            exit 1
          }
          Write-Output "Uploading assets: $assets"

          gh release create $tag $assets `
            --title "SemarEnv $tag" `
            --notes "Build $(Get-Date -Format 'yyyy-MM-dd')" `
            --repo arinadi/SemarEnv

      - name: Update latest tag
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:$env:PAT_TOKEN@github.com/arinadi/SemarEnv.git"
          git push origin --delete latest 2>$null
          git tag -f latest
          git push origin latest
